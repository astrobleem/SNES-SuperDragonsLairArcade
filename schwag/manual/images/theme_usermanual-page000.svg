<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a00;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#2a1500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8860B" />
      <stop offset="25%" style="stop-color:#FFD700" />
      <stop offset="50%" style="stop-color:#FFFFFF" />
      <stop offset="75%" style="stop-color:#FFD700" />
      <stop offset="100%" style="stop-color:#B8860B" />
    </linearGradient>
    <filter id="titleGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="200" fill="url(#coverGrad)" />
  <!-- Castle silhouette -->
  <rect x="200" y="150" width="200" height="50" fill="#0a0500"/>
  <rect x="220" y="130" width="30" height="70" fill="#100800"/>
  <rect x="215" y="125" width="40" height="8" fill="#150a00"/>
  <rect x="350" y="130" width="30" height="70" fill="#100800"/>
  <rect x="345" y="125" width="40" height="8" fill="#150a00"/>
  <rect x="280" y="110" width="40" height="90" fill="#100800"/>
  <polygon points="300,90 275,110 325,110" fill="#150a00"/>
  <!-- Dragon wings spread behind castle -->
  <path d="M150,120 Q130,80 100,90 Q80,60 60,80 Q40,50 30,70 L50,100 Q70,90 90,100 Q110,110 130,115Z" fill="#1a0a00" opacity="0.5"/>
  <path d="M450,120 Q470,80 500,90 Q520,60 540,80 Q560,50 570,70 L550,100 Q530,90 510,100 Q490,110 470,115Z" fill="#1a0a00" opacity="0.5"/>
  <!-- Fire glow at base -->
  <ellipse cx="300" cy="195" rx="200" ry="15" fill="#FF4500" opacity="0.15"/>
  <!-- Double border -->
  <rect x="5" y="5" width="590" height="190" rx="5" ry="5" fill="none" stroke="#FFD700" stroke-width="2"/>
  <rect x="10" y="10" width="580" height="180" rx="3" ry="3" fill="none" stroke="#8B6914" stroke-width="1"/>
  <!-- Title -->
  <text x="300" y="55" dominant-baseline="middle" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="32" font-weight="bold" fill="url(#titleGold)" filter="url(#titleGlow)">SUPER DRAGON'S LAIR</text>
  <text x="300" y="82" dominant-baseline="middle" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="18" fill="#FFD700" letter-spacing="6">ARCADE</text>
  <!-- Decorative line -->
  <line x1="180" y1="100" x2="420" y2="100" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
  <polygon points="295,97 300,92 305,97" fill="#FFD700" opacity="0.5"/>
  <polygon points="295,103 300,108 305,103" fill="#FFD700" opacity="0.5"/>
</svg>
