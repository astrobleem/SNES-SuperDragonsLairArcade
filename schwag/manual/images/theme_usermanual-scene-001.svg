<svg width="600" height="160" viewBox="0 0 600 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a15;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#666666" />
      <stop offset="50%" style="stop-color:#999999" />
      <stop offset="100%" style="stop-color:#666666" />
    </linearGradient>
    <filter id="bridgeGlow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="160" fill="url(#bridgeGrad)" />
  <!-- Water/moat at bottom -->
  <path d="M0,140 Q50,135 100,140 Q150,145 200,138 Q250,132 300,140 Q350,148 400,138 Q450,130 500,140 Q550,148 600,140 L600,160 L0,160Z" fill="#0a2040" opacity="0.6"/>
  <!-- Bridge planks falling -->
  <rect x="150" y="115" width="40" height="8" fill="#5a3a1a" opacity="0.5" transform="rotate(-15,170,119)"/>
  <rect x="250" y="110" width="40" height="8" fill="#5a3a1a" opacity="0.6"/>
  <rect x="350" y="118" width="40" height="8" fill="#5a3a1a" opacity="0.4" transform="rotate(10,370,122)"/>
  <!-- Castle turrets on sides -->
  <rect x="0" y="80" width="50" height="80" fill="#1a1a30"/>
  <rect x="-5" y="72" width="60" height="12" fill="#222240"/>
  <rect x="5" y="60" width="10" height="20" fill="#222240"/>
  <rect x="35" y="60" width="10" height="20" fill="#222240"/>
  <rect x="550" y="80" width="50" height="80" fill="#1a1a30"/>
  <rect x="545" y="72" width="60" height="12" fill="#222240"/>
  <rect x="555" y="60" width="10" height="20" fill="#222240"/>
  <rect x="585" y="60" width="10" height="20" fill="#222240"/>
  <!-- Portcullis hint -->
  <line x1="555" y1="85" x2="555" y2="130" stroke="#444460" stroke-width="2" opacity="0.3"/>
  <line x1="565" y1="85" x2="565" y2="130" stroke="#444460" stroke-width="2" opacity="0.3"/>
  <line x1="575" y1="85" x2="575" y2="130" stroke="#444460" stroke-width="2" opacity="0.3"/>
  <!-- Tentacle hint from water -->
  <path d="M200,155 Q210,140 205,130 Q215,125 210,115" fill="none" stroke="#2a4050" stroke-width="2" opacity="0.3"/>
  <!-- Border -->
  <rect x="6" y="6" width="588" height="148" rx="6" ry="6" fill="none" stroke="url(#stoneGrad)" stroke-width="3"/>
  <!-- Title -->
  <text x="300" y="45" dominant-baseline="middle" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="30" font-weight="bold" fill="url(#stoneGrad)" filter="url(#bridgeGlow)">THE DRAWBRIDGE</text>
  <text x="300" y="72" dominant-baseline="middle" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="13" fill="#8888AA" letter-spacing="4">THE ENTRYWAY</text>
</svg>
