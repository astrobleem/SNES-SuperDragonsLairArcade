<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a15;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#151525;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050510;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4444AA" />
      <stop offset="50%" style="stop-color:#8888FF" />
      <stop offset="100%" style="stop-color:#4444AA" />
    </linearGradient>
    <filter id="elecGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="200" fill="url(#darkGrad)" />
  <!-- Lightning bolts -->
  <path d="M80,10 L90,50 L85,50 L100,90 L90,90 L110,140" fill="none" stroke="#6666FF" stroke-width="2" opacity="0.4" filter="url(#elecGlow)"/>
  <path d="M520,15 L510,55 L515,55 L500,95 L510,95 L490,145" fill="none" stroke="#6666FF" stroke-width="2" opacity="0.4" filter="url(#elecGlow)"/>
  <path d="M40,60 L55,80 L50,80 L65,110" fill="none" stroke="#4444CC" stroke-width="1.5" opacity="0.3" filter="url(#elecGlow)"/>
  <path d="M560,70 L545,90 L550,90 L535,120" fill="none" stroke="#4444CC" stroke-width="1.5" opacity="0.3" filter="url(#elecGlow)"/>
  <!-- Thorns from bottom -->
  <path d="M0,200 L10,170 L15,200 L25,160 L30,200 L40,175 L45,200" fill="#1a1a30" stroke="#2a2a50" stroke-width="1"/>
  <path d="M555,200 L565,165 L570,200 L580,170 L585,200 L595,180 L600,200" fill="#1a1a30" stroke="#2a2a50" stroke-width="1"/>
  <!-- Horse and knight silhouette -->
  <path d="M50,160 Q60,140 70,145 Q75,130 85,135 L90,150 Q95,145 100,155 L95,160 Q85,155 80,165 L65,168 Q55,165 50,160Z" fill="#0a0a20" opacity="0.5"/>
  <!-- Sword silhouette -->
  <line x1="540" y1="40" x2="555" y2="160" stroke="#555577" stroke-width="3" opacity="0.3"/>
  <line x1="540" y1="70" x2="556" y2="70" stroke="#555577" stroke-width="2.5" opacity="0.3"/>
  <!-- Border -->
  <rect x="8" y="8" width="584" height="184" rx="8" ry="8" fill="none" stroke="url(#electricBlue)" stroke-width="3"/>
  <!-- Title -->
  <text x="300" y="85" dominant-baseline="middle" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="38" font-weight="bold" fill="url(#electricBlue)" filter="url(#elecGlow)">THE BLACK KNIGHT</text>
  <text x="300" y="120" dominant-baseline="middle" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="16" fill="#6666CC" letter-spacing="4">THE PHANTOM GUARDIAN</text>
</svg>
