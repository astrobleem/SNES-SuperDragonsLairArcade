<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="forgeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF4500;stop-opacity:0.8" />
      <stop offset="40%" style="stop-color:#8B2500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a0a00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5A2B" />
      <stop offset="50%" style="stop-color:#CD7F32" />
      <stop offset="100%" style="stop-color:#8B5A2B" />
    </linearGradient>
    <filter id="forgeGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="200" fill="url(#forgeGrad)" />
  <!-- Anvil silhouette -->
  <path d="M60,140 L100,140 L110,155 L105,170 L55,170 L50,155Z" fill="#3a1500" opacity="0.5"/>
  <!-- Hammer silhouette -->
  <rect x="70" y="105" width="8" height="35" fill="#4a2500" opacity="0.4" transform="rotate(-20,74,120)"/>
  <rect x="60" y="95" width="28" height="15" rx="3" fill="#4a2500" opacity="0.4" transform="rotate(-20,74,100)"/>
  <!-- Flying sword hints -->
  <line x1="480" y1="50" x2="530" y2="80" stroke="#CD7F32" stroke-width="2" opacity="0.3"/>
  <line x1="505" y1="55" x2="505" y2="75" stroke="#CD7F32" stroke-width="1.5" opacity="0.3"/>
  <line x1="520" y1="130" x2="560" y2="110" stroke="#CD7F32" stroke-width="2" opacity="0.25"/>
  <!-- Sparks / embers -->
  <circle cx="150" cy="60" r="2" fill="#FF6600" opacity="0.6" filter="url(#forgeGlow)"/>
  <circle cx="180" cy="45" r="1.5" fill="#FFAA00" opacity="0.5" filter="url(#forgeGlow)"/>
  <circle cx="420" cy="55" r="2" fill="#FF6600" opacity="0.5" filter="url(#forgeGlow)"/>
  <circle cx="460" cy="40" r="1.5" fill="#FFAA00" opacity="0.4" filter="url(#forgeGlow)"/>
  <circle cx="300" cy="30" r="1.5" fill="#FF4400" opacity="0.4" filter="url(#forgeGlow)"/>
  <!-- Border -->
  <rect x="8" y="8" width="584" height="184" rx="8" ry="8" fill="none" stroke="url(#bronzeGrad)" stroke-width="3"/>
  <!-- Title -->
  <text x="300" y="85" dominant-baseline="middle" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="38" font-weight="bold" fill="url(#bronzeGrad)" filter="url(#forgeGlow)">THE SMITHEE</text>
  <text x="300" y="120" dominant-baseline="middle" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="16" fill="#CD7F32" letter-spacing="4">THE CURSED BLACKSMITH</text>
</svg>
