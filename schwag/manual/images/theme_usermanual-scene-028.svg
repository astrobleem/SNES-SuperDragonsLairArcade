<svg width="600" height="160" viewBox="0 0 600 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lairGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF4500;stop-opacity:0.8" />
      <stop offset="40%" style="stop-color:#8B0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lairGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8860B" />
      <stop offset="50%" style="stop-color:#FFD700" />
      <stop offset="100%" style="stop-color:#B8860B" />
    </linearGradient>
    <filter id="lairGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="160" fill="url(#lairGrad)" />
  <!-- Gold coins at bottom -->
  <ellipse cx="300" cy="155" rx="250" ry="15" fill="#8B6914" opacity="0.4"/>
  <circle cx="150" cy="148" r="6" fill="none" stroke="#DAA520" stroke-width="1" opacity="0.4"/>
  <circle cx="200" cy="145" r="6" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
  <circle cx="400" cy="145" r="6" fill="none" stroke="#DAA520" stroke-width="1" opacity="0.4"/>
  <circle cx="450" cy="148" r="6" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
  <!-- Dragon eye hints -->
  <ellipse cx="80" cy="60" rx="8" ry="5" fill="#FFFF00" opacity="0.3"/>
  <ellipse cx="520" cy="60" rx="8" ry="5" fill="#FFFF00" opacity="0.3"/>
  <!-- Flame wisps -->
  <path d="M50,140 Q55,120 50,100 Q60,110 55,125" fill="none" stroke="#FF6600" stroke-width="2" opacity="0.3" filter="url(#lairGlow)"/>
  <path d="M550,140 Q545,120 550,100 Q540,110 545,125" fill="none" stroke="#FF6600" stroke-width="2" opacity="0.3" filter="url(#lairGlow)"/>
  <!-- Crystal bubble hint -->
  <circle cx="300" cy="130" r="12" fill="none" stroke="#9966CC" stroke-width="1" opacity="0.25"/>
  <!-- Border -->
  <rect x="6" y="6" width="588" height="148" rx="6" ry="6" fill="none" stroke="url(#lairGold)" stroke-width="3"/>
  <!-- Title -->
  <text x="300" y="55" dominant-baseline="middle" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="32" font-weight="bold" fill="url(#lairGold)" filter="url(#lairGlow)">THE DRAGON'S LAIR</text>
  <text x="300" y="85" dominant-baseline="middle" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="14" fill="#FF6600" letter-spacing="4">THE FINAL BATTLE</text>
</svg>
